# render.yaml — Render.com Blueprint for AttendX For TAASCOR
# Database is embedded in the Docker container — no external DB needed.

services:
  # ── Main Web Service (PHP + Apache + MariaDB all-in-one) ─────
  - type: web
    name: attendx-taascor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ATTENDANCE/health.php

  # ── Keep-Alive Cron (pings every 14 min to prevent sleep) ───
  - type: cron
    name: attendx-keepalive
    runtime: image
    image:
      url: curlimages/curl:8.11.1
    schedule: "*/14 * * * *"
    startCommand: "curl -sf https://attendx-taascor.onrender.com/ATTENDANCE/health.php || true"
