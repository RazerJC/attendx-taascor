# render.yaml — Render.com Blueprint for TAASCOR Attendance Monitoring System
services:
  - type: web
    name: attendx-taascor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SESSION_SECRET
        generateValue: true
